<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organisateur d'épreuve — tous sports</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0f1418;--pn:#171e24;--ln:#2a343d;--tx:#e8edf1;--mu:#93a1ad;--ac:#4aa8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{display:grid;grid-template-columns:430px 1fr;grid-template-rows:auto 1fr 110px;height:100%}
header{grid-column:1/3;display:flex;gap:10px;align-items:center;padding:8px 14px;background:#0b0f12;border-bottom:1px solid var(--ln);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650}
.tag{background:#5a2a12;color:#ffc9a3;border-radius:4px;padding:2px 8px;font-size:12px}
.sp{flex:1}
button,select,input{font:inherit}
button{background:#22303b;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{background:#2c3e4c}
button.on,button.go{background:var(--ac);color:#04121f;border-color:var(--ac)}
button:disabled{opacity:.5;cursor:default}
#side{grid-row:2/4;background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--ln)}
#tabs button{padding:4px 8px;font-size:13px}
#body{overflow:auto;padding:10px 12px;flex:1}
#map{min-height:0;background:#ddd}
#prof{background:#0b0f12;border-top:1px solid var(--ln)}
#prof svg{width:100%;height:100%;display:block}
h2{font-size:15px;margin:14px 0 6px}
h2:first-child{margin-top:0}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:4px 6px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
th{color:var(--mu);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.go{cursor:pointer}
tr.go:hover{background:#1f2a33}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{background:#1c252d;border-radius:8px;padding:8px 10px}
.kpi b{display:block;font-size:19px}
.kpi span{color:var(--mu);font-size:12px}
.note{color:var(--mu);font-size:12.5px}
.warn{background:#3a2a10;border:1px solid #6b4b14;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
label.p{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
label.p input,label.p select,td input{width:100%;background:#0b0f12;color:var(--tx);border:1px solid var(--ln);border-radius:5px;padding:4px 6px}
td input{width:80px;text-align:right}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.late{color:#ff8a5c}
.mk{border-radius:50%;border:2px solid #111;width:14px;height:14px}
.lbl{background:#fff;border:1.5px solid #111;border-radius:9px;padding:0 5px;font:bold 11px sans-serif;color:#111;white-space:nowrap}
#print{display:none}
@media print{
  html,body{background:#fff;color:#000;height:auto}
  #app{display:none}
  #print{display:block;padding:0 6mm;font-size:10.5pt}
  #print h1{font-size:18pt;margin:0 0 4pt}
  #print h2{font-size:13pt;margin:14pt 0 4pt;break-after:avoid}
  #print td,#print th{border-bottom:1px solid #bbb;color:#000}
  #print th{color:#444}
  #print .warn{background:#fff3d6;border:1px solid #c90;color:#000}
  #print .note{color:#444}
  #print .kpi div{background:#f0f0f0}
  #print .kpi span{color:#444}
  #print svg{width:100%;height:auto;border:1px solid #999}
  #print input{border:0;background:none;color:#000}
  .late{color:#b00}
}
.tipm{background:rgba(255,255,255,.88);border:0;box-shadow:none;font:600 11px sans-serif;color:#111;padding:1px 4px;text-align:center}
.tipm::before{display:none}
.ph{flex-basis:100%;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-top:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Organisateur d'épreuve</h1><b id="pname" style="color:#ffd23f"></b><span class="tag">Prototype</span>
    <select id="sport"></select>
    <span class="sp"></span>
    <button id="bSnap" class="on" title="Le tracé suit les routes entre deux clics">Suivre les routes</button>
    <button id="bUndo">Annuler le dernier point</button>
    <button id="bClear">Effacer</button>
    <label><input type="file" id="gpx" accept=".gpx" hidden><button id="bGpx" type="button">Importer un GPX</button></label>
    <button id="bRun" class="go" disabled>Analyser</button>
    <button id="bPr" disabled>Imprimer</button>
  </header>
  <div id="side"><div id="tabs"></div><div id="body"></div></div>
  <div id="map"></div>
  <div id="prof"></div>
</div>
<div id="print"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

const HY0 = { ...HY }, SPORTS0 = JSON.parse(JSON.stringify(SPORTS));

// ───────── Carte et tracé ─────────
const map = L.map('map', { maxZoom: 21 }).setView([46.6, 2.5], 6);

async function leg(a, b) {

map.on('click', e => {
  if (busy) return;
  if (drawing) { drawClick(e.latlng); return; }
  if (placing && A) { const o = addObj(placing, e.latlng.lat, e.latlng.lng); selO = o.id; placing = null; checkObj(); store(); drawObj(); panel(true); return; }
  if (tab === 'Épreuve') addPoint(e.latlng);

$('#bUndo').onclick = () => { WP.pop(); LEGS.pop(); drawRoute(); store(); panel(); };
$('#bClear').onclick = () => { WP = []; LEGS = []; A = null; lyRes.clearLayers(); drawRoute(); store(); panel(); $('#prof').innerHTML = ''; $('#bPr').disabled = true; };
$('#bSnap').onclick = e => { snap = !snap; e.target.classList.toggle('on', snap); };
$('#bGpx').onclick = () => $('#gpx').click();
$('#gpx').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const x = new DOMParser().parseFromString(await f.text(), 'text/xml'), pts = [...x.querySelectorAll('trkpt, rtept')].map(n => [+n.getAttribute('lat'), +n.getAttribute('lon')]).filter(p => isFinite(p[0]) && isFinite(p[1]));
  if (pts.length < 2) { alert('Aucun tracé trouvé dans ce fichier.'); return; }
  WP = [pts[0], pts[pts.length - 1]]; LEGS = [pts]; A = null; drawRoute(); map.fitBounds(L.latLngBounds(pts).pad(.1)); store(); panel(); e.target.value = '';
};
let ST = { cur: 'p1', projects: {}, profiles: {}, types: null, tasks: null }, DONE = {};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.projects) ST = Object.assign(ST, s); else { const o = JSON.parse(localStorage.getItem('organisateur-v1')); if (o && o.WP) ST.projects.p1 = Object.assign({ name: 'Mon épreuve' }, o); } } catch (e) { }
if (!ST.projects[ST.cur]) { const k = Object.keys(ST.projects)[0]; if (k) ST.cur = k; else { ST.cur = 'p1'; ST.projects.p1 = { name: 'Mon épreuve' }; } }
for (const k in ST.profiles) SPORTS[k] = Object.assign({}, SPORTS[k] || {}, ST.profiles[k]);
function snapshot() { return { name: (ST.projects[ST.cur] || {}).name || 'Sans nom', WP, LEGS, HY: { ...HY }, COST: { ...COST }, snap, done: DONE, OBJ: OBJ.map(o => ({ id: o.id, t: o.t, lat: o.lat, lng: o.lng, L: o.L, W: o.W, ang: o.ang })), DRAW: DRAW.map(d => ({ id: d.id, k: d.k, t: d.t, pts: d.pts, txt: d.txt, n: d.n })), BG: BG && !BG.big ? BG : null, LV, SUMM, XT }; }
function store() { ST.projects[ST.cur] = snapshot(); try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) { } }
const ready = () => (SPORTS[HY.sport] || {}).site ? WP.length >= 1 : line().length >= 2;

// ───────── Analyse ─────────
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function overpass(q) {
  const urls = ['https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
  for (let pass = 0; pass < 1; pass++) {
    for (const u of urls) {
      try { const c = new AbortController(), t = setTimeout(() => c.abort(), 30000), r = await fetch(u, { method: 'POST', signal: c.signal, body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } }); clearTimeout(t); if (r.ok) { const j = await r.json(); if (j && j.elements) return j; } } catch (e) { }
    }

}
// ───────── Source principale en France : BD TOPO de l'IGN (rapide, officielle) ─────────
async function wfs(type, box, props) {
  const out = [];
  for (let start = 0; start < 20000; start += 5000) {
    const r = await fetch(`https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=BDTOPO_V3:${type}&BBOX=${box.map(v => v.toFixed(5)).join(',')},urn:ogc:def:crs:EPSG::4326&OUTPUTFORMAT=application/json&COUNT=5000&STARTINDEX=${start}&PROPERTYNAME=${props}`);
    if (!r.ok) throw new Error('IGN'); const j = await r.json(); out.push(...j.features); if (j.features.length < 5000) break;
  }

}
function boxes(LL, m) {
  const o = [], flush = b => { const dla = m / 110540, dlo = m / (111320 * Math.cos(b[0] * Math.PI / 180)); o.push([b[0] - dla, b[1] - dlo, b[2] + dla, b[3] + dlo]); }; let b = null;
  for (const p of LL) {
    if (!b) b = [p[0], p[1], p[0], p[1]]; else { b[0] = Math.min(b[0], p[0]); b[1] = Math.min(b[1], p[1]); b[2] = Math.max(b[2], p[0]); b[3] = Math.max(b[3], p[1]); }
    if ((b[2] - b[0]) * 110540 > 1300 || (b[3] - b[1]) * 111320 * Math.cos(p[0] * Math.PI / 180) > 1300) { flush(b); b = [p[0], p[1], p[0], p[1]]; }
  }
  if (b) flush(b); return o;
}
const inFrance = p => p[0] > 41.2 && p[0] < 51.2 && p[1] > -5.3 && p[1] < 9.7;
async function ign(LL, ends, dense) {
  const el = [], seen = new Set(), run = async (l, fn) => { for (let i = 0; i < l.length; i += 4) await Promise.all(l.slice(i, i + 4).map(fn)); };
  const HW = { 4: 'primary', 3: 'secondary', 2: 'residential', 1: 'service', 0: 'track', '-1': 'path' };
  await run(boxes(LL, 60), async b => { for (const x of await wfs('troncon_de_route', b, 'cleabs,nature,importance,position_par_rapport_au_sol,nom_voie_ban_gauche,nom_collaboratif_gauche,cpx_toponyme_route_nommee,cpx_numero,geometrie')) {
    const p = x.properties, id = p.cleabs || x.id; if (seen.has(id) || !x.geometry || x.geometry.type !== 'LineString') continue; seen.add(id);
    const n = p.nature || '', imp = +p.importance || 5, cls = /Sentier|Escalier|cyclable/.test(n) ? -1 : /Chemin|empierr/.test(n) ? 0 : /Bac|maritime/.test(n) ? null : imp <= 2 ? 4 : imp === 3 ? 3 : imp <= 5 ? 2 : 1; if (cls === null) continue;
    el.push({ id, tags: { highway: HW[cls], name: p.nom_voie_ban_gauche || p.nom_collaboratif_gauche || p.cpx_toponyme_route_nommee || p.cpx_numero || '', bridge: p.position_par_rapport_au_sol && p.position_par_rapport_au_sol !== '0' ? 'yes' : '', junction: /Rond-point/.test(n) ? 'roundabout' : '' }, geometry: x.geometry.coordinates.map(c => ({ lat: c[1], lon: c[0] })) });
  } });

    const id = (x.properties || {}).cleabs || x.id; if (seen.has(id) || !x.geometry) continue; seen.add(id);
    const ring = x.geometry.type === 'MultiPolygon' ? x.geometry.coordinates[0][0] : x.geometry.coordinates[0]; if (!ring || ring.length < 3) continue;
    let la = 0, lo = 0; for (const c of ring) { la += c[1]; lo += c[0]; } la /= ring.length; lo /= ring.length;

    if (ends.some(e => Math.hypot((e[0] - la) * 110540, (e[1] - lo) * 111320 * Math.cos(la * Math.PI / 180)) < 240)) el.push({ id, tags: { building: 'yes' }, geometry: ring.map(c => ({ lat: c[1], lon: c[0] })) });

}
// simplification d'une ligne (Douglas-Peucker) : indices des points gardés
function simplify(P, tol) {

async function alti(pts) {

    const ch = pts.slice(i, i + 150), u = `https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json?lon=${ch.map(p => p[1].toFixed(6)).join('|')}&lat=${ch.map(p => p[0].toFixed(6)).join('|')}&resource=ign_rge_alti_wld&zonly=true`;

const ROADS = { motorway: 4, trunk: 4, primary: 4, secondary: 3, tertiary: 3, unclassified: 2, residential: 2, living_street: 2, service: 1, track: 0, path: -1, footway: -1, cycleway: -1, pedestrian: -1, steps: -1 };
async function analyseSite(status) {
  const c = WP[0], S = SPORTS[HY.sport], KX = 111320 * Math.cos(c[0] * Math.PI / 180), KY = 110540;
  const xy = p => [(p[1] - c[1]) * KX, (p[0] - c[0]) * KY], inv = p => [p[1] / KY + c[0], p[0] / KX + c[1]];

  if (!osm.elements.length) { source = 'OSM'; osm = await overpass(`[out:json][timeout:60];way["building"](around:350,${c[0].toFixed(5)},${c[1].toFixed(5)});out geom;`); }
  const T0 = (() => { const m = /^(\d+):(\d+)/.exec(HY.start); return m ? +m[1] * 60 + +m[2] : 540; })(), dur = (HY.duree || 6) * 60;
  return { sport: S, site: true, DS: 10, P: [[0, 0]], N: 1, len: 0, xy, inv, LL: [c], loop: true, Z: null, up: 0, down: 0, GR: new Float32Array(1), J: [], C: [], BU: new Float32Array(1), SP: Float32Array.of(HY.spect), FZ: [], B: [], RAV: [],
    source, BLD: osm.elements.filter(w => w.geometry && w.tags && w.tags.building).map(w => w.geometry.map(g => xy([g.lat, g.lon]))), near: (x, y) => ({ i: 0, d: Math.hypot(x, y) }),
    SEC: [{ i: 0, nom: 'Poste de secours du site' }], laps: 1, T0, first: () => T0, last: () => T0 + dur, winner: dur, lastIn: dur,
    Q: { sig: 0, bar: 0, rub: 0, fleche: 0, ravito: 0, secours: 1, benRav: 0, benSec: HY.perSecours, base: HY.base, ben: HY.base } };
}
async function analyse(status) {

  const lat0 = ll[0][0], lon0 = ll[0][1], KX = 111320 * Math.cos(lat0 * Math.PI / 180), KY = 110540;

$('#bPr').onclick = () => {
  const keep = tab, sec = t => { tab = t; return TABS[t](); };
  $('#print').innerHTML = `<h1>Dossier d'organisation — ${SPORTS[HY.sport].nom}</h1><p>${HY.date ? new Date(HY.date + 'T00:00').toLocaleDateString('fr-FR', { dateStyle: 'full' }) + ', ' : ''}départ à ${hm(A.T0)}, ${fmt(HY.parts)} participants et ${fmt(HY.spect)} spectateurs attendus.</p>${sec('Synthèse')}<h2>Profil</h2>${profSVG(1200, 160, false)}<h2>Carrefours, signaleurs et fermetures</h2>${sec('Carrefours')}<h2>Secours, ravitaillements et public</h2>${sec('Secours et public')}<h2>Panneaux publicitaires</h2>${sec('Panneaux')}${OBJ.length ? '<h2>Implantation du site</h2>' + siteSVG() + sec('Implantation').replace(/<button[^>]*>.*?<\/button>/g, '').replace(/<h2>Ajouter<\/h2>|<h2>Réglages<\/h2>[\s\S]*$/g, '') : ''}${sec('Organisation')}`;
  tab = keep; print();
};
$('#sport').onchange = e => { HY.sport = e.target.value; Object.assign(HY, pick(SPORTS[HY.sport])); snap = SPORTS[HY.sport].snap; $('#bSnap').classList.toggle('on', snap); if (SPORTS[HY.sport].site && WP.length > 1) { WP = [WP[0]]; LEGS = []; } A = null; lyRes.clearLayers(); drawRoute(); store(); panel(); };
setBase(ST.base || 'plan');
loadProject(ST.cur);
</script>
